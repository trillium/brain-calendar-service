name: Canon conformance

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canon-audit:
    name: Canon Audit
    runs-on: ubuntu-latest
    steps:
      # The audit compares verbatim files by sha256 against a private Canon
      # checkout, which a public CI run cannot fetch without a secret. It stays
      # a local gate (`CANON_ROOT=/path/to/canon pnpm run canon:audit`); CI
      # records the skip instead of failing on an unreachable private repo.
      - name: Skip Canon audit (private Canon checkout unavailable in CI)
        run: echo "::notice::canon:audit needs a private Canon checkout and runs locally only."
